name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Build hash: $SHORT_SHA"

          # App shell
          cp index.html styles.css db.js nextcloud.js app.js sw.js manifest.webmanifest _site/
          cp .nojekyll CNAME _site/

          # Stamp commit hash into menus + service worker cache name
          sed -i "s/__BUILD_HASH__/${SHORT_SHA}/g" _site/index.html
          sed -i "s/__BUILD_HASH__/${SHORT_SHA}/g" _site/sw.js

          # Icons (PWA / favicons)
          mkdir -p _site/icons
          cp -r icons/. _site/icons/
          # Keep source brand icon available
          if [ -f images/icon.png ]; then
            mkdir -p _site/images
            cp images/icon.png _site/images/icon.png
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
